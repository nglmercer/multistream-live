<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="display: flex; justify-content: space-between; flex-direction: column;">
    <script src="./poelement.js"></script>

    </script>
    <script src="../components/unitcomponent.js"></script>
    <div>
      <dialog-container class="widget_form">
        <custom-dialog class="widget_content" style="border: 0; background-color: #777;">
          <div class="formdialog"></div>
        </custom-dialog>
      </dialog-container>
    </div>
    <script type="module" >
      const widget_form = document.querySelector('.widget_form');
      widget_form.show();
      const widget_content = document.querySelector('.widget_content');
      const options = [
        {
          label: 'Option 1',
          callback: () => {
            console.log('Option 1 selected');
          },
          class: 'save-btn'
        },
        {
          label: 'Option 2',
          callback: () => {
            console.log('Option 2 selected');
          },
          class: 'cancel-btn'
        }
        
      ];
      widget_content.options = options;
      widget_content.addEventListener('button-clicked', (event) => {
        console.log('Button clicked:', event.detail);
      });
      const config1 =     {
        id: 'progress1',
        goal: 200,
        currentValue: 50,
        text: 'Meta a',
        autoIncreaseBy: 100,
        style: {
            barColor: '#4caf50',
            backgroundColor: '#e0e0e0',
            textColor: 'black',
            fontSize: '32px',
            barHeight: '64px',
            textPosition: 'inside-center',
            borderRadius: '10px',
            textStroke: '0.5px gray'
        }
    }
    const formDialog = document.querySelector('.formdialog');

    const inputsConfig = [
        { id: 'inputID', name: 'inputID', value: 'Widget', placeholder: 'your widget name', title: 'inputID', pattern: '[a-zA-Z0-9]+' },
        { id: 'goal', name: 'goal', value: '100', placeholder: 'your widget name', title: 'inputID' },
        { id: 'inputText', name: 'inputText', value: 'my goal', placeholder: 'your widget name', title: 'inputID' },
        { id: 'autoIncreaseBy', name: 'autoIncreaseBy', value: '100', placeholder: 'your widget name', title: 'inputID' },
        { id: 'style_barColor', name: 'style_barColor', value: '#4caf50', placeholder: 'your widget name', title: 'inputID' },
        { id: 'style_backgroundColor', name: 'style_backgroundColor', value: '#e0e0e0', placeholder: 'your widget name', title: 'inputID' },
        { id: 'style_textColor', name: 'style_textColor', value: 'black', placeholder: 'your widget name', title: 'inputID' },
        { id: 'style_fontSize', name: 'style_fontSize', value: '32px', placeholder: 'your widget name', title: 'inputID' },
        { id: 'style_barHeight', name: 'style_barHeight', value: '64px', placeholder: 'your widget name', title: 'inputID' },
        { id: 'style_textPosition', name: 'style_textPosition', value: 'inside-center', placeholder: 'your widget name', title: 'inputID' },
        { id: 'style_borderRadius', name: 'style_borderRadius', value: '10px', placeholder: 'your widget name', title: 'inputID' },
        { id: 'style_textStroke', name: 'style_textStroke', value: '0.5px gray', placeholder: 'your widget name', title: 'inputID' },
    ];

    inputsConfig.forEach(config => {
        const inputElement = createCustomInput(config);
        formDialog.appendChild(inputElement);
    });

    
    function createCustomInput({ id, name, value, placeholder, title, pattern }) {
        const input = document.createElement('custom-input');
        input.setAttribute('id', id);
        input.setAttribute('name', name);
        input.setAttribute('value', value);
        input.setAttribute('placeholder', placeholder);
        input.setAttribute('title', title);
        if (pattern) {
            input.setAttribute('pattern', pattern);
        }
        return input;
    }

    </script>
</body>
</html>
